
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>SokoPulse · Compare prices across Kenyan shops</title>
      <meta name="description" content="Compare prices on phones, laptops, TVs, groceries and more across Kenyan shops. See every shop's price, sorted by price, on SokoPulse." />
      <meta property="og:title" content="SokoPulse · Compare prices across Kenyan shops" />
      <meta property="og:description" content="Every shop's price for the same product, sorted by price." />
      <meta property="og:type" content="website" />
      <meta property="og:url" content="https://sokopulse.co.ke" />
      <meta name="theme-color" content="#0C1416" />
      <script>
        /*
         * Theme before first paint, so dark-mode visitors never see a white
         * flash. "theme" in localStorage is the visitor's explicit choice
         * (light | dark); without one we follow the system setting.
         */
        (function () {
          var choice = null;
          try { choice = localStorage.getItem('theme'); } catch (e) {}
          var dark = choice === 'dark' ||
            (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        })();
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
