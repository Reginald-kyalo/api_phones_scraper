
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>SokoPulse · Compare prices across Kenyan shops</title>
      <meta name="description" content="Compare prices on phones, laptops, TVs, groceries and more across Kenyan shops. See every shop's price, sorted by price, on SokoPulse." />
      <meta property="og:title" content="SokoPulse · Compare prices across Kenyan shops" />
      <meta property="og:description" content="Every shop's price for the same product, sorted by price." />
      <meta property="og:type" content="website" />
      <meta property="og:url" content="https://sokopulse.co.ke" />
      <meta name="theme-color" content="#0C1416" />
      <script>
        /*
         * Deep-link restore for static hosts with no rewrite rule (GitHub Pages).
         * 404.html parks the requested URL and bounces here; put it back before
         * anything reads location.
         *
         * ⛔ This MUST be a classic inline script in <head>, not module code:
         * ES imports are hoisted, so routes.ts would run createBrowserRouter —
         * which snapshots location.pathname — before any statement in main.tsx.
         */
        (function () {
          var parked = sessionStorage.getItem('spa-redirect');
          if (!parked) return;
          sessionStorage.removeItem('spa-redirect');
          try {
            var u = new URL(parked);
            if (u.origin === location.origin && u.pathname !== location.pathname) {
              history.replaceState(null, '', u.pathname + u.search + u.hash);
            }
          } catch (e) {
            /* malformed parked value: stay on the root rather than throw */
          }
        })();
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
