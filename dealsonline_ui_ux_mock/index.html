      <meta name="description" content="Compare prices on phones, laptops, TVs, groceries and more across Kenyan shops. See every shop's price, sorted by price, on SokoPulse." />

      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <meta name="theme-color" content="#0C1416" />
      <script>
        /*
         * Theme before first paint, so dark-mode visitors never see a white
         * flash. "theme" in localStorage is the visitor's explicit choice
         * (light | dark); without one we follow the system setting.
         */
        (function () {
          var choice = null;
          try { choice = localStorage.getItem('theme'); } catch (e) {}
          var dark = choice === 'dark' ||
            (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        })();
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
